site_name: Recipe Shelter — Documentation (POC sandbox)
site_description: POC MkDocs Material pour le projet Recipe Shelter
site_author: POC sandbox (Quentin Lagenèbre)
site_url: https://keutin.github.io/recipe-shelter-mkdocs-poc/
repo_url: https://github.com/Keutin/recipe-shelter-mkdocs-poc
repo_name: Keutin/recipe-shelter-mkdocs-poc
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Mode clair
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search:
      lang: fr
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)'
  - awesome-pages
  - tags:
      tags_file: tags.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Keutin/recipe-shelter-mkdocs-poc
