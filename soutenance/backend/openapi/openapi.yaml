      summary: Liste des commentaires d'une recette
      parameters:
        - name: recipeId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Liste (paginee ou plate selon implementation). TODO confirmer la forme exacte.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Comment"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Comment"
                      pagination:
                        $ref: "#/components/schemas/PaginationMetadata"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [Comments]
      summary: Poster un commentaire (ou une reponse) sur une recette
      security: [{ cookieAuth: [] }]
      parameters:
        - name: recipeId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
                rating:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 5
                parentCommentId:
                  type:
                    - integer
                    - "null"
                  description: |
                    Si renseigne, le commentaire est une reponse. Dans ce cas,
                    `rating` doit etre absent ou null.
      responses:
        "201":
          description: Commentaire cree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
